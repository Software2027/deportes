<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel del Ciclista | Ciclismo Malagueño{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Plataforma oficial de movilidad, eventos y circuitos ciclistas del municipio de Malagueño.{% endblock %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    {% load static %}
    <!-- Leaflet CSS (Local para alta disponibilidad sin timeouts) -->
    <link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">

    <!-- Favicon Oficial -->
    <link rel="icon" type="image/png" href="{% static 'IMG/logo_iso_municipalidad.png' %}">
    <link rel="apple-touch-icon" href="{% static 'IMG/logo_iso_municipalidad.png' %}">

    <!-- Font Awesome 6 Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Estilos Base y Modulares del Panel del Ciclista -->
    <link rel="stylesheet" href="{% static 'css/pages/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/headers/header_ciclista.css' %}">
    <link rel="stylesheet" href="{% static 'css/footers/footer_ciclista.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="ciclista-panel-mode">

    <!-- 1. Header / Topbar del Ciclista -->
    {% include "headers/header_ciclista.html" %}

    <!-- 2. Contenido Principal del Ciclista -->
    <main id="main-ciclista-content">
        {% if messages %}
        <div class="container" style="padding-top: 1rem; margin-bottom: 0.5rem; position: relative; z-index: 100;">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <!-- 3. Bottom Navigation Bar Móvil -->
    {% include "footers/footer_ciclista.html" %}

    <!-- Leaflet JS (Local para alta disponibilidad sin timeouts) -->
    <script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
