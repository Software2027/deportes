{% load static %}
<!-- ----------------------------------------------------------------------- -->
<!-- BOTTOM NAVIGATION BAR FIJA PARA DISPOSITIVOS MÓVILES                     -->
<!-- ----------------------------------------------------------------------- -->
<nav class="bottom-nav-bar" aria-label="Navegación Móvil del Participante">
    <a href="{% url 'mapa_carrera' %}{% if circuito %}?circuito_id={{ circuito.id }}{% elif request.session.circuito_seleccionado_id %}?circuito_id={{ request.session.circuito_seleccionado_id }}{% endif %}" class="bottom-nav-item {% if request.resolver_match.url_name == 'mapa_carrera' %}active{% endif %}" title="Mapa Satelital del Circuito">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>MAPA</span>
    </a>
    <a href="{% url 'mi_progreso' %}{% if circuito %}?circuito_id={{ circuito.id }}{% elif request.session.circuito_seleccionado_id %}?circuito_id={{ request.session.circuito_seleccionado_id }}{% endif %}" class="bottom-nav-item {% if request.resolver_match.url_name == 'mi_progreso' %}active{% endif %}" title="Mi Progreso y Métricas">
        <i class="fa-solid fa-trophy"></i>
        <span>PROGRESO</span>
    </a>
    <a href="{% url 'circuitos_ciclista' %}" class="bottom-nav-item {% if request.resolver_match.url_name == 'circuitos_ciclista' %}active{% endif %}" title="Ver catálogo de circuitos">

        <span>RECORRIDOS</span>
    </a>

        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>SALIR</span>
